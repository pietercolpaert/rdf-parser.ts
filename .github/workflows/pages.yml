name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Prepare Pages source
        run: |
          rm -rf _pages _site
          mkdir -p _pages
          cp README.md _pages/README.md
          cp -R example _pages/example
          mkdir -p _pages/dist
          cp -R dist/browser _pages/dist/browser
          cat > _pages/index.md <<'EOF'
          ---
          title: rdf-parser.ts
          ---

          [Open the interactive browser example](./example/)

          {% capture readme %}{% include_relative README.md %}{% endcapture %}
          {{ readme | markdownify }}
          EOF
          cat > _pages/_config.yml <<'EOF'
          title: rdf-parser.ts
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
